name: Docker-Image bauen

on:
  push:
    tags: ["v*"]            # v1.0.0 veröffentlicht das Image mit den Tags 1.0.0, 1.0 und latest
  pull_request:             # nur bauen und testen, nichts veröffentlichen
    paths:
      - Dockerfile
      - requirements.txt
      - "*.py"
      - .github/workflows/docker.yml
  workflow_dispatch:        # manuell starten (veröffentlicht ein Image mit dem Branch-Namen als Tag)

env:
  IMAGE: ghcr.io/myname-99a/untis-google-calendar-sync

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Schnelltest: Image für amd64 bauen, Python-Dateien prüfen und den Zeitplan anzeigen
      - name: Schnelltest bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: untis-sync:test
          cache-from: type=gha

      - name: Schnelltest ausführen
        run: |
          docker run --rm \
            -e UNTIS_SERVER=example.webuntis.com -e UNTIS_USER=test -e UNTIS_PASSWORD=test \
            untis-sync:test sh -c "
              ! grep -rn 000_Archive /app &&
              python -c 'import auth; assert auth.TOKEN_PATH == \"/data/token.json\", auth.TOKEN_PATH' &&
              python -m py_compile main3.0.py get_week_and_lesson_information.py &&
              python -c 'import config, auth, changes, notifications' &&
              python changes.py > /dev/null &&
              python run_loop.py --plan > /dev/null"

      - name: Bei GitHub-Container-Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels festlegen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Bauen (amd64 + arm64) und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max