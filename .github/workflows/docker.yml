name: Build Docker image

on:
  push:
    tags: ["v*"]            # v1.0.0 publishes the image with the tags 1.0.0, 1.0 and latest
  pull_request:             # only build and test, publish nothing
    paths:
      - Dockerfile
      - requirements.txt
      - "*.py"
      - .github/workflows/docker.yml
  workflow_dispatch:        # start manually (publishes an image with the branch name as tag)

env:
  IMAGE: ghcr.io/myname-99a/untis-google-calendar-sync

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Smoke test: build the image for amd64, check the Python files and show the schedule
      - name: Build smoke test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: untis-sync:test
          cache-from: type=gha

      - name: Run smoke test
        run: |
          docker run --rm \
            -e UNTIS_SERVER=example.webuntis.com -e UNTIS_USER=test -e UNTIS_PASSWORD=test \
            untis-sync:test sh -c "
              ! grep -rn 000_Archive /app &&
              python -c 'import auth; assert auth.TOKEN_PATH == \"/data/token.json\", auth.TOKEN_PATH' &&
              python -m py_compile main3.0.py get_week_and_lesson_information.py &&
              python -c 'import config, texts, auth, changes, notifications' &&
              python texts.py &&
              python changes.py > /dev/null &&
              python run_loop.py --plan > /dev/null &&
              SYNC_TIMES=21:00,21:30 SYNC_WINDOW=06:00-20:59 python run_loop.py --plan > /dev/null &&
              SYNC_INTERVAL_MINUTES=0 python run_loop.py --plan > /dev/null"

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (amd64 + arm64) and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
